# Local Amdocs mock server
amdocs.authentication.url=http://127.0.0.1:9090/token/oauth/resourcetoken
amdocs.group.url=http://127.0.0.1:9090/bus-server/webapi/v2/MM/accounts
amdocs.quote.url=http://127.0.0.1:9090/bus-server/webapi/v2/MM/quotes
amdocs.cashin.url=http://127.0.0.1:9090/bus-server/webapi/v2/MM/transactions

# Mock authentication credentials
amdocs.authentication.grant-type=password
amdocs.authentication.api-key=mock-key
amdocs.authentication.username=mock-user
amdocs.authentication.password=mock-password

# Mock API credentials
amdocs.client-id=mock-client
amdocs.api-key=mock-key

# Disable sensitive HTTP request/response logging
logging.level.org.apache.hc.client5.http.headers=OFF
logging.level.org.apache.hc.client5.http.wire=OFF
logging.level.org.apache.http.headers=OFF
logging.level.org.apache.http.wire=OFF

# Use a random application port if a real web server is started
server.port=0